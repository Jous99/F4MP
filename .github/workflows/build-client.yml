# Workflow de compilacion del CLIENTE (F4MPClient.dll)
# Usa las dependencias vendidas en el repo (third_party/deps). NO usa vcpkg.
# Se dispara en push a main (solo si cambia el cliente), al crear un tag "v..." o a mano.

name: Build Client

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'third_party/**'
      - '.github/workflows/build-client.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-client:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configurar cliente
        run: cmake -S client -B client/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compilar cliente
        run: cmake --build client/build

      - name: Reunir binarios
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item client/build/F4MPClient.dll   dist/
          Copy-Item client/redist/steam_api64.dll dist/
          Copy-Item third_party/deps/x64-windows/bin/*.dll dist/ -ErrorAction SilentlyContinue

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: F4MPClient
          path: dist/

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
