# Workflow de compilacion del SERVIDOR (F4MPServer.exe)
# Se dispara en push a main (solo si cambia el servidor), al crear un tag "v..." o a mano.

name: Build Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_TRIPLET: x64-windows

jobs:
  build-server:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Instalar dependencias (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install gamenetworkingsockets:$env:VCPKG_TRIPLET spdlog:$env:VCPKG_TRIPLET

      - name: Configurar servidor
        run: cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Compilar servidor
        run: cmake --build server/build

      - name: Reunir binarios
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item server/build/F4MPServer.exe dist/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/$env:VCPKG_TRIPLET/bin/*.dll" dist/ -ErrorAction SilentlyContinue

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: F4MPServer
          path: dist/

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
