# Workflow de compilacion del SERVIDOR (F4MPServer.exe)
# Usa las dependencias vendidas en el repo (third_party/deps). NO usa vcpkg.
# Se dispara en push a main (solo si cambia el servidor), al crear un tag "v..." o a mano.

name: Build Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'third_party/**'
      - '.github/workflows/build-server.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configurar servidor
        run: cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compilar servidor
        run: cmake --build server/build

      - name: Reunir binarios
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item server/build/F4MPServer.exe dist/
          Copy-Item third_party/win-x64/bin/*.dll dist/ -ErrorAction SilentlyContinue

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: F4MPServer
          path: dist/

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
