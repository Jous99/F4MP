# Workflow de compilacion de F4MP (cliente + servidor)
# Corre en GitHub Actions, sobre un runner de Windows con MSVC.
# Se dispara solo en cada push a main, al crear un tag "v..." o a mano.

name: Build

on:
  push:
    branches:
      - main          # compila automaticamente en cada push a main
    tags:
      - 'v*'          # y publica un Release cuando marcas un tag (v0.3, v1.0, ...)
  workflow_dispatch:  # boton para lanzarlo a mano desde la pestana Actions

# Necesario para que el paso de Release pueda crear el release y subir los archivos
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest   # runner de Windows de GitHub

    steps:
      # 1. Descarga tu codigo (incluye las libs .lib ya commiteadas)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Prepara el entorno de MSVC (cl.exe) sin depender del generador de Visual Studio
      - name: Preparar MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 3. Compila el CLIENTE (F4MPClient.dll) con Ninja
      - name: Configurar cliente
        run: cmake -S client -B client/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compilar cliente
        run: cmake --build client/build

      # 4. Compila el SERVIDOR (F4MPServer.exe) con Ninja
      - name: Configurar servidor
        run: cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compilar servidor
        run: cmake --build server/build

      # 5. Junta todos los binarios en una carpeta "dist"
      #    (con Ninja el binario queda en la raiz de build/, sin subcarpeta RelWithDebInfo)
      - name: Reunir binarios
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item client/build/F4MPClient.dll   dist/
          Copy-Item client/redist/steam_api64.dll dist/
          Copy-Item server/build/F4MPServer.exe   dist/

      # 6. Guarda los binarios como "artifact" (descargable desde la corrida)
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: F4MP-binaries
          path: dist/

      # 7. Si fue un tag, crea un Release y adjunta los binarios
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
