# Workflow de compilacion de F4MP (cliente + servidor)
# Corre en GitHub Actions, sobre un runner de Windows con MSVC.
# Se dispara al crear un tag "v..." (ej: v0.3) o manualmente desde la pestana Actions.

name: Build

on:
  push:
    tags:
      - 'v*'          # cualquier tag que empiece por v (v0.3, v1.0, ...)
  workflow_dispatch:  # boton para lanzarlo a mano desde GitHub

# Necesario para que el paso de Release pueda crear el release y subir los archivos
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest   # runner de Windows (trae Visual Studio 2022 + CMake)

    steps:
      # 1. Descarga tu codigo (incluye las libs .lib ya commiteadas)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Compila el CLIENTE (F4MPClient.dll)
      - name: Configurar cliente
        run: cmake -S client -B client/build -G "Visual Studio 17 2022" -A x64
      - name: Compilar cliente
        run: cmake --build client/build --config RelWithDebInfo

      # 3. Compila el SERVIDOR (F4MPServer.exe)
      - name: Configurar servidor
        run: cmake -S server -B server/build -G "Visual Studio 17 2022" -A x64
      - name: Compilar servidor
        run: cmake --build server/build --config RelWithDebInfo

      # 4. Junta todos los binarios en una carpeta "dist"
      - name: Reunir binarios
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item client/build/RelWithDebInfo/F4MPClient.dll dist/
          Copy-Item client/redist/steam_api64.dll             dist/
          Copy-Item server/build/RelWithDebInfo/F4MPServer.exe dist/

      # 5. Guarda los binarios como "artifact" (descargable desde la corrida)
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: F4MP-binaries
          path: dist/

      # 6. Si fue un tag, crea un Release y adjunta los binarios
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
